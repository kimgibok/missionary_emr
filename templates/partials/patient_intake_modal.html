<div class="modal-overlay" id="intake-modal-overlay">
    <div class="modal-box wide">
        <h3 class="modal-title">환자 검색 / 신규 등록</h3>

        <div class="search-row">
            <input class="field-input" type="text" id="search-input" placeholder="이름으로 검색">
            <button class="btn-primary btn-inline" type="button" id="search-btn">검색</button>
        </div>
        <div id="search-results" class="patient-list"></div>

        <h3 class="form-section-title">신규 환자 등록</h3>
        <form id="new-patient-form" class="form-grid">
            <div>
                <label class="field-label">이름(한글)</label>
                <input class="field-input" type="text" id="name_kr" required>
            </div>
            <div>
                <label class="field-label">이름(현지어)</label>
                <input class="field-input" type="text" id="name_local">
            </div>
            <div>
                <label class="field-label">성별</label>
                <select class="field-input" id="sex" required>
                    <option value="M">남</option>
                    <option value="F">여</option>
                </select>
            </div>
            <div>
                <label class="field-label">출생연도</label>
                <input class="field-input" type="number" id="birth_year" required>
            </div>
            <div>
                <label class="field-label">체중 (kg, 선택)</label>
                <input class="field-input" type="number" step="0.1" id="weight">
            </div>
            <button class="btn-primary" type="submit">환자 등록 + 방문 등록</button>
        </form>

        <button class="btn-secondary" type="button" id="intake-modal-close">닫기</button>
    </div>
</div>
