{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안내팀 · 의료선교 EMR</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/nav.css' %}">
    <link rel="stylesheet" href="{% static 'css/page.css' %}">
    <link rel="stylesheet" href="{% static 'css/info.css' %}">
    <link rel="stylesheet" href="{% static 'css/modal.css' %}">
</head>
<body>
    {% include 'partials/nav.html' %}
    <main class="page-content">
        <h1>안내팀</h1>

        <section class="card">
            <h2 class="card-title">의사별 대기 인원</h2>
            <div id="wait-counts" class="wait-counts"></div>
        </section>

        <section class="card">
            <h2 class="card-title">환자 검색</h2>
            <div class="search-row">
                <input class="field-input" type="text" id="search-input" placeholder="이름으로 검색">
                <button class="btn-primary btn-inline" id="search-btn">검색</button>
            </div>
            <div id="search-results" class="patient-list"></div>
        </section>

        <section class="card">
            <h2 class="card-title">신규 환자 등록</h2>
            <form id="new-patient-form" class="form-grid">
                <div>
                    <label class="field-label">이름(한글)</label>
                    <input class="field-input" type="text" id="name_kr" required>
                </div>
                <div>
                    <label class="field-label">이름(현지어)</label>
                    <input class="field-input" type="text" id="name_local">
                </div>
                <div>
                    <label class="field-label">성별</label>
                    <select class="field-input" id="sex" required>
                        <option value="M">남</option>
                        <option value="F">여</option>
                    </select>
                </div>
                <div>
                    <label class="field-label">출생연도</label>
                    <input class="field-input" type="number" id="birth_year" required>
                </div>
                <div>
                    <label class="field-label">체중 (kg, 선택)</label>
                    <input class="field-input" type="number" step="0.1" id="weight">
                </div>
                <button class="btn-primary" type="submit">환자 등록 + 방문 등록</button>
            </form>
        </section>

        <div id="ticket-result"></div>
    </main>
    {% include 'partials/modal.html' %}
    <script src="{% static 'js/api.js' %}"></script>
    <script src="{% static 'js/patient-intake.js' %}"></script>
    <script src="{% static 'js/nav.js' %}"></script>
    <script src="{% static 'js/modal.js' %}"></script>
    <script src="{% static 'js/info.js' %}"></script>
</body>
</html>
