{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 · 의료선교 EMR</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <h1 class="login-title">의료선교 EMR</h1>
            <p class="login-subtitle">계정 정보를 입력해주세요</p>

            <form id="login-form">
                <label class="field-label" for="username">아이디</label>
                <input class="field-input" type="text" id="username" autocomplete="username" required>

                <label class="field-label" for="password">비밀번호</label>
                <input class="field-input" type="password" id="password" autocomplete="current-password" required>

                <p class="error-message" id="error-message"></p>

                <button class="btn-primary" type="submit">로그인</button>
            </form>
        </div>
    </div>

    <script src="{% static 'js/api.js' %}"></script>
    <script src="{% static 'js/login.js' %}"></script>
</body>
</html>
