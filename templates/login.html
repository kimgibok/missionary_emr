{% load static_version %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 · 의료선교 EMR</title>
    <link rel="stylesheet" href="{% static_v 'css/base.css' %}">
    <link rel="stylesheet" href="{% static_v 'css/login.css' %}">
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <h1 class="login-title">의료선교 EMR</h1>
            <p class="login-subtitle">계정 정보를 입력해주세요</p>

            <div class="login-expired" id="login-expired" role="alert" hidden>
                <strong>로그인이 만료되었습니다</strong>
                <span>로그인은 8시간 동안 유지됩니다. 다시 로그인해 주세요.
                    약국 출력 PC라면 다시 로그인해야 조제지 자동 출력이 이어집니다(자동 출력·용지 설정은 그대로 남아 있어요).</span>
            </div>

            <form id="login-form">
                <label class="field-label" for="username">아이디</label>
                <input class="field-input" type="text" id="username" autocomplete="username" required>

                <label class="field-label" for="password">비밀번호</label>
                <input class="field-input" type="password" id="password" autocomplete="current-password" required>

                <p class="error-message" id="error-message"></p>

                <button class="btn-primary" type="submit">로그인</button>
            </form>
        </div>
    </div>

    <script src="{% static_v 'js/api.js' %}"></script>
    <script src="{% static_v 'js/login.js' %}"></script>
</body>
</html>
